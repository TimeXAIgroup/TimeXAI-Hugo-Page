name: Import Publications From Bibtex

on:
  push:
    branches: ['aai-first-version']
    paths:
      - 'publications.bib'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-publications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-academic
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Academic CLI + deps
        run: |
          python -m pip install --upgrade pip
          pip install "academic>=0.10.0" pyyaml

      - name: Validate Bib file
        run: |
          test -f publications.bib || (echo "❌ publications.bib not found" && exit 1)

      - name: Run Academic import
        run: |
          academic import publications.bib content/publication/ --compact --verbose

      - name: Fix author field name
        run: |
          if [ -d "content/publication" ]; then
            find content/publication -name "index.md" -type f -exec sed -i 's/^author:/authors:/g' {} +
          fi
          
      - name: Fix authors from BibTeX (robust)
        run: |
          python << 'EOF'
          import os
          import yaml
          import re
      
          # --- BibTeX parsen ---
          with open("publications.bib", "r", encoding="utf-8") as f:
              bib = f.read()
      
          entries = re.split(r"@", bib)
          bib_authors = {}
      
          for entry in entries:
              if "author" not in entry:
                  continue
      
              # key holen
              key_match = re.match(r"(\w+)\s*{([^,]+),", entry)
              if not key_match:
                  continue
      
              key = key_match.group(2).strip()
      
              # author field holen
              author_match = re.search(r"author\s*=\s*{([^}]*)}", entry, re.DOTALL)
              if not author_match:
                  continue
      
              raw_authors = author_match.group(1)
      
              authors = []
              for a in re.split(r"\s+AND\s+", raw_authors):
                  a = a.strip()
      
                  if "," in a:
                      last, first = [p.strip() for p in a.split(",", 1)]
                      authors.append(f"{first} {last}")
                  else:
                      authors.append(a)
      
              bib_authors[key] = authors
      
          # --- MD Dateien überschreiben ---
          base = "content/publication"
      
          for root, dirs, files in os.walk(base):
              for f in files:
                  if f != "index.md":
                      continue
      
                  path = os.path.join(root, f)
      
                  with open(path, "r", encoding="utf-8") as file:
                      content = file.read()
      
                  if not content.startswith("---"):
                      continue
      
                  parts = content.split("---")
                  if len(parts) < 3:
                      continue
      
                  frontmatter = yaml.safe_load(parts[1])
      
                  # DOI als Schlüssel nutzen
                  doi = frontmatter.get("doi", "")
                  key = doi
      
                  if key in bib_authors:
                      frontmatter["authors"] = bib_authors[key]
      
                      new_frontmatter = yaml.dump(
                          frontmatter,
                          allow_unicode=True,
                          sort_keys=False
                      )
      
                      new_content = "---\n" + new_frontmatter + "---" + parts[2]
      
                      with open(path, "w", encoding="utf-8") as file:
                          file.write(new_content)
      
          print("✅ Authors replaced from BibTeX")
          EOF

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add content/publication/

          git commit -m "auto: update publication from bibtex" || echo "No changes"

          git push
